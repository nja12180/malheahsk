name: Supabase Keepalive (REST)

# Postgres 연결 문자열 없이 Supabase REST API(PostgREST)로 DB에 실제 SELECT 를 보냅니다.
# - 비밀번호/인코딩/IPv6/pooler 문제가 원천적으로 사라집니다.
# - 필요한 시크릿: SUPABASE_URL, SUPABASE_ANON_KEY (둘 다 공개 가능한 값)

on:
  schedule:
    # KST 09:07 / 15:07 / 21:07  (UTC 00:07 / 06:07 / 12:07)
    - cron: '7 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase via REST
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::secrets.SUPABASE_URL 이 비어 있습니다. (Settings > Secrets and variables > Actions > 'Secrets' 탭)"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::secrets.SUPABASE_ANON_KEY 이 비어 있습니다. (Dashboard > Settings > API Keys 의 anon / publishable 키)"
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) echo "✅ URL 형식 정상: $SUPABASE_URL" ;;
            *) echo "::error::SUPABASE_URL 은 https://<ref>.supabase.co 형식이어야 합니다. (지금 값의 접두부: ${SUPABASE_URL%%:*}://)" ; exit 1 ;;
          esac

      - name: Query keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          url="${SUPABASE_URL%/}/rest/v1/keepalive_ping?select=pinged_at&limit=1"

          ok=0
          for attempt in 1 2 3; do
            echo "── Attempt ${attempt}/3 ──"
            code=$(curl -sS -m 25 -o body.txt -w '%{http_code}' \
                     -H "apikey: ${SUPABASE_ANON_KEY}" \
                     -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                     -H "Accept: application/json" \
                     "$url" || echo 000)

            echo "HTTP ${code}"
            echo "body: $(head -c 400 body.txt)"

            if [ "$code" = "200" ]; then ok=1; break; fi

            case "$code" in
              401|403) echo "::error::인증 실패 — SUPABASE_ANON_KEY 값이 잘못되었거나(공백/줄바꿈 포함) 키가 폐기되었습니다." ; break ;;
              404)     echo "::error::테이블 keepalive_ping 이 없습니다. Supabase SQL Editor 에서 SQL_SETUP.md 의 SQL 을 먼저 실행하세요." ; break ;;
              000)     echo "네트워크 오류 또는 타임아웃 — 20초 후 재시도" ; sleep 20 ;;
              *)       echo "예상 밖 응답 — 20초 후 재시도" ; sleep 20 ;;
            esac
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Supabase keepalive 실패 — 위 HTTP 코드/본문을 확인하세요."
            exit 1
          fi
          echo "✅ Keepalive OK (PostgREST SELECT 성공)"

      - name: Close stale alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          num=$(gh issue list --state open --search 'Supabase keepalive 실패 in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "✅ 정상 복구되었습니다. (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true
            gh issue close "$num" || true
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          MSG="🔴 Supabase keepalive 실패 — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Supabase keepalive 실패"
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "$MSG" || echo "::warning::이슈 코멘트 실패"
          else
            gh issue create --title "$TITLE" --body "$MSG" || echo "::warning::이슈 생성 실패 — Settings > General > Features 의 Issues 활성 여부 확인"
          fi
