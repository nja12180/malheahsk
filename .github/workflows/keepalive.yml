name: Supabase Keepalive

# Free 플랜 프로젝트는 7일간 DB 활동이 없으면 자동 일시정지됩니다.
# 이 워크플로는 하루 3회 실제 SQL 쿼리를 보내 "활동"으로 집계되게 하고,
# 실패하면 GitHub 이슈(및 선택적 웹훅)로 알립니다.

on:
  schedule:
    # KST 09:07 / 15:07 / 21:07  (UTC 00:07 / 06:07 / 12:07)
    # 정시(:00)는 GitHub Actions 혼잡 시간대라 일부러 7분으로 어긋나게 잡았습니다.
    - cron: '7 0,6,12 * * *'
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: read
  issues: write # 실패 알림 이슈 생성/코멘트용

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run keepalive query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::시크릿 SUPABASE_DB_URL 이 설정되지 않았습니다."
            exit 1
          fi

          if ! command -v psql >/dev/null 2>&1; then
            echo "psql 이 없어 postgresql-client 를 설치합니다."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          ok=0
          for attempt in 1 2 3; do
            echo "── Attempt ${attempt}/3 ──"
            if psql "$SUPABASE_DB_URL" \
                 --no-psqlrc --quiet --tuples-only --no-align \
                 -v ON_ERROR_STOP=1 \
                 -c "select 'keepalive_ok ' || now() || ' db=' || current_database();" 2>&1 | tail -n 20; then
              ok=1
              break
            fi
            echo "실패 (attempt ${attempt}). 20초 후 재시도합니다."
            sleep 20
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Supabase keepalive 실패 — 3회 재시도 모두 실패했습니다. 프로젝트가 일시정지되었을 수 있습니다."
            exit 1
          fi

          echo "✅ Keepalive OK"

      - name: Close stale alert issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          num=$(gh issue list --state open --search 'Supabase keepalive 실패 in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "✅ 정상 복구되었습니다. (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true
            gh issue close "$num" || true
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WEBHOOK_STYLE: ${{ vars.ALERT_WEBHOOK_STYLE }}
        run: |
          set -uo pipefail
          MSG="🔴 Supabase keepalive 실패 — 프로젝트가 일시정지되었을 수 있습니다. 대시보드에서 Resume 하세요. run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Supabase keepalive 실패"

          # 1) GitHub 이슈: 열린 이슈가 있으면 코멘트, 없으면 생성
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "$MSG" || echo "이슈 코멘트 실패 (issues 비활성?)"
          else
            gh issue create --title "$TITLE" --body "$MSG" || echo "이슈 생성 실패 (issues 비활성?)"
          fi

          # 2) (선택) Slack / Discord 웹훅 — 시크릿 ALERT_WEBHOOK_URL 이 있을 때만
          if [ -n "${WEBHOOK_URL:-}" ]; then
            case "${WEBHOOK_STYLE:-slack}" in
              discord) payload=$(jq -nc --arg c "$MSG" '{content:$c}') ;;
              *)       payload=$(jq -nc --arg t "$MSG" '{text:$t}') ;;
            esac
            curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK_URL" \
              || echo "웹훅 전송 실패 (URL/스타일 확인)"
          fi

          echo "::notice::알림 전송 단계 종료"
